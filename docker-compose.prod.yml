version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - btc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./btc-backend
    restart: always
    environment:
      PORT: '3001'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change-me-in-production}
      JWT_ISSUER: btc-backend
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - btc-network

  frontend:
    build:
      context: ./btc-frontend
      args:
        # Empty => the React app calls the same origin; nginx proxies /order,/bag,/user to backend
        REACT_APP_BACKEND_URL: ''
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - btc-network

volumes:
  pgdata:

networks:
  btc-network:
